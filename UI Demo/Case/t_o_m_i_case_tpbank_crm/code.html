<!DOCTYPE html>

<html class="light" lang="vi"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>TPBank CRM - Tạo mới Case</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body { font-family: 'Manrope', sans-serif; background-color: #f8f9ff; }
        .tap-highlight-transparent { -webkit-tap-highlight-color: transparent; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-background text-on-background min-h-screen">
<!-- TopAppBar -->
<header class="fixed top-0 left-0 right-0 z-50 bg-white dark:bg-slate-900 border-b border-slate-100 dark:border-slate-800 shadow-sm flex justify-between items-center w-full px-4 h-16">
<div class="flex items-center gap-3">
<button class="active:scale-95 duration-150 p-2 rounded-full hover:bg-slate-50">
<span class="material-symbols-outlined text-[#502070] dark:text-purple-400">arrow_back</span>
</button>
<h1 class="font-['Manrope'] font-bold text-lg tracking-tight text-[#502070] dark:text-purple-400">Case Management</h1>
</div>
<button class="active:scale-95 duration-150 p-2 rounded-full hover:bg-slate-50">
<span class="material-symbols-outlined text-[#502070] dark:text-purple-400">search</span>
</button>
</header>
<main class="mt-20 px-4 space-y-6 max-w-lg mx-auto">
<!-- Progress Indicator -->
<div class="flex items-center justify-between mb-4 px-2">
<h2 class="font-headline-sm text-headline-sm text-primary">Tạo mới yêu cầu</h2>
<span class="text-label-md font-label-md text-on-surface-variant bg-surface-container px-3 py-1 rounded-full">Bước 1/1</span>
</div>
<!-- Form Container -->
<div class="space-y-4">
<!-- Section: Customer -->
<div class="bg-white rounded-xl p-4 shadow-[0_2px_8px_rgba(0,0,0,0.04)] border border-slate-100">
<label class="block text-label-md font-label-md text-on-surface-variant mb-2">KHÁCH HÀNG</label>
<div class="relative">
<span class="absolute left-3 top-1/2 -translate-y-1/2 material-symbols-outlined text-outline">person_search</span>
<input class="w-full pl-10 pr-4 py-3 bg-slate-50 border-transparent focus:border-primary-container focus:ring-0 rounded-lg text-body-md font-body-md transition-all" placeholder="Tìm kiếm tên, SĐT hoặc CIF..." type="text"/>
</div>
<div class="mt-3 p-3 bg-purple-50 rounded-lg flex items-center gap-3 border border-purple-100">
<div class="w-10 h-10 rounded-full bg-primary-container flex items-center justify-center text-white font-bold">
                        AN
                    </div>
<div>
<div class="text-body-md font-semibold text-primary">Nguyễn Văn An</div>
<div class="text-label-sm font-label-sm text-on-surface-variant">CIF: 12345678 • 090****123</div>
</div>
<button class="ml-auto text-primary-container">
<span class="material-symbols-outlined">close</span>
</button>
</div>
</div>
<!-- Section: Request Details -->
<div class="bg-white rounded-xl p-4 shadow-[0_2px_8px_rgba(0,0,0,0.04)] border border-slate-100 space-y-4">
<div>
<label class="block text-label-md font-label-md text-on-surface-variant mb-2">LOẠI YÊU CẦU</label>
<div class="relative">
<select class="w-full appearance-none px-4 py-3 bg-slate-50 border-transparent focus:border-primary-container focus:ring-0 rounded-lg text-body-md font-body-md pr-10">
<option>Chọn loại yêu cầu</option>
<option selected="">Khiếu nại</option>
<option>Tư vấn</option>
<option>Sự cố kỹ thuật</option>
<option>Khóa thẻ khẩn cấp</option>
</select>
<span class="absolute right-3 top-1/2 -translate-y-1/2 material-symbols-outlined text-outline pointer-events-none">expand_more</span>
</div>
</div>
<div>
<label class="block text-label-md font-label-md text-on-surface-variant mb-2">SẢN PHẨM LIÊN QUAN</label>
<div class="relative">
<select class="w-full appearance-none px-4 py-3 bg-slate-50 border-transparent focus:border-primary-container focus:ring-0 rounded-lg text-body-md font-body-md pr-10">
<option selected="">Thẻ tín dụng TPBank EVO</option>
<option>Vay tiêu dùng tín chấp</option>
<option>Tài khoản thanh toán</option>
<option>Tiết kiệm Savy</option>
</select>
<span class="absolute right-3 top-1/2 -translate-y-1/2 material-symbols-outlined text-outline pointer-events-none">expand_more</span>
</div>
</div>
<!-- Priority Selection -->
<div>
<label class="block text-label-md font-label-md text-on-surface-variant mb-2">MỨC ĐỘ ƯU TIÊN</label>
<div class="flex gap-2">
<button class="flex-1 py-2 rounded-full border border-slate-200 text-label-md font-label-md text-on-surface-variant hover:bg-slate-50 transition-colors">Low</button>
<button class="flex-1 py-2 rounded-full border-2 border-primary-container bg-purple-50 text-label-md font-label-md text-primary-container font-bold">Medium</button>
<button class="flex-1 py-2 rounded-full border border-slate-200 text-label-md font-label-md text-on-surface-variant hover:bg-slate-50 transition-colors">High</button>
</div>
</div>
</div>
<!-- SLA & Channel -->
<div class="grid grid-cols-2 gap-4">
<div class="bg-white rounded-xl p-4 shadow-[0_2px_8px_rgba(0,0,0,0.04)] border border-slate-100">
<label class="block text-label-md font-label-md text-on-surface-variant mb-2">KÊNH TIẾP NHẬN</label>
<div class="relative">
<select class="w-full appearance-none pl-3 pr-8 py-2 bg-slate-50 border-transparent focus:border-primary-container focus:ring-0 rounded-lg text-body-md font-body-md">
<option>Hotline</option>
<option selected="">Tại quầy</option>
<option>RM</option>
</select>
<span class="absolute right-2 top-1/2 -translate-y-1/2 material-symbols-outlined text-outline pointer-events-none text-sm">expand_more</span>
</div>
</div>
<div class="bg-primary-container rounded-xl p-4 shadow-[0_2px_8px_rgba(0,0,0,0.1)] border border-primary text-white">
<label class="block text-[10px] font-bold opacity-80 uppercase tracking-wider mb-1">Gợi ý SLA</label>
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-lg">schedule</span>
<span class="text-body-md font-bold">24 Giờ</span>
</div>
<p class="text-[10px] mt-1 opacity-70">Dự kiến xong: 14:00 Mai</p>
</div>
</div>
<!-- Description -->
<div class="bg-white rounded-xl p-4 shadow-[0_2px_8px_rgba(0,0,0,0.04)] border border-slate-100">
<label class="block text-label-md font-label-md text-on-surface-variant mb-2">MÔ TẢ CHI TIẾT</label>
<textarea class="w-full px-4 py-3 bg-slate-50 border-transparent focus:border-primary-container focus:ring-0 rounded-lg text-body-md font-body-md resize-none" placeholder="Nhập nội dung chi tiết yêu cầu của khách hàng..." rows="4"></textarea>
</div>
<!-- Attachments -->
<div class="bg-white rounded-xl p-4 shadow-[0_2px_8px_rgba(0,0,0,0.04)] border border-slate-100">
<div class="flex justify-between items-center mb-3">
<label class="block text-label-md font-label-md text-on-surface-variant">ĐÍNH KÈM (ẢNH/TÀI LIỆU)</label>
<span class="text-label-sm font-label-sm text-outline">Tối đa 5MB</span>
</div>
<div class="flex gap-3 overflow-x-auto pb-2">
<div class="flex-shrink-0 w-20 h-20 bg-slate-100 rounded-lg border-2 border-dashed border-slate-300 flex flex-col items-center justify-center text-slate-400 active:bg-slate-200 transition-colors">
<span class="material-symbols-outlined">add_a_photo</span>
<span class="text-[10px] font-bold mt-1">Thêm</span>
</div>
<!-- Mock uploaded item -->
<div class="flex-shrink-0 w-20 h-20 rounded-lg overflow-hidden relative border border-slate-200">
<img alt="Identity Document" class="w-full h-full object-cover" data-alt="Close up of a professional bank document with official seal and signature under soft office lighting" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAXpREzhZiYcF-pRXhR20OiNu4Rxd9NaLoddR2d3XUlKK1LHW-JJjS0E-l2IBBiPdF5fUjf_AEy_EUBFeB7M1JjhOpLmi20Le1hhtOd1yCIfscDkZeFE3HFliFTPVx1y8Zboi8rhpcdMihgam2dOFFaM8W8EE_Gj0sfsSnz5fO5a7i2Zf3favQzLr5ynO3cjAWhkSF3vozn2DskgM84xy_pNKQ0Td6xo7o7AkSCVLVGQSgfFuZRZbKOYXSgwWm1opwJsRwNVpOuH8g"/>
<button class="absolute top-1 right-1 bg-black/50 text-white rounded-full p-0.5">
<span class="material-symbols-outlined text-xs">close</span>
</button>
</div>
</div>
</div>
</div>
<!-- Action Button -->
<div class="pt-4 pb-8">
<button class="w-full py-4 bg-secondary-container text-white font-headline-sm rounded-xl shadow-lg shadow-secondary/20 active:scale-[0.98] transition-all flex items-center justify-center gap-2">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">task_alt</span>
                Tạo Case
            </button>
<p class="text-center text-label-sm font-label-sm text-outline mt-4">Dữ liệu sẽ được đồng bộ ngay lập tức lên CRM Core</p>
</div>
</main>
<!-- BottomNavBar -->
</body></html>
