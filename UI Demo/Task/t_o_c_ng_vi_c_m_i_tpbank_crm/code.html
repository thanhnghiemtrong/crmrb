<!DOCTYPE html>

<html class="light" lang="vi"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container-low": "#eff4ff",
                        "surface": "#f8f9ff",
                        "on-secondary-container": "#5d2300",
                        "surface-tint": "#7a499a",
                        "on-primary": "#ffffff",
                        "surface-container-lowest": "#ffffff",
                        "on-tertiary": "#ffffff",
                        "tertiary-fixed": "#f2daff",
                        "secondary-fixed-dim": "#ffb693",
                        "primary-container": "#502070",
                        "background": "#f8f9ff",
                        "on-tertiary-container": "#b992d6",
                        "on-error": "#ffffff",
                        "inverse-surface": "#213145",
                        "on-background": "#0b1c30",
                        "outline-variant": "#cfc3d1",
                        "on-secondary-fixed-variant": "#7a3000",
                        "error-container": "#ffdad6",
                        "secondary": "#a04100",
                        "on-secondary-fixed": "#341000",
                        "on-error-container": "#93000a",
                        "inverse-primary": "#e3b5ff",
                        "primary-fixed-dim": "#e3b5ff",
                        "surface-container": "#e5eeff",
                        "on-tertiary-fixed": "#2b0747",
                        "on-primary-fixed-variant": "#603180",
                        "surface-dim": "#cbdbf5",
                        "tertiary-fixed-dim": "#e0b7fe",
                        "surface-container-highest": "#d3e4fe",
                        "primary-fixed": "#f4daff",
                        "on-surface-variant": "#4c444f",
                        "on-surface": "#0b1c30",
                        "on-primary-fixed": "#2f004c",
                        "on-primary-container": "#c18ce3",
                        "on-secondary": "#ffffff",
                        "surface-bright": "#f8f9ff",
                        "tertiary": "#33104e",
                        "inverse-on-surface": "#eaf1ff",
                        "secondary-fixed": "#ffdbcb",
                        "outline": "#7d7480",
                        "error": "#ba1a1a",
                        "secondary-container": "#fc7728",
                        "primary": "#390259",
                        "on-tertiary-fixed-variant": "#5a3875",
                        "tertiary-container": "#4a2865",
                        "surface-container-high": "#dce9ff",
                        "surface-variant": "#d3e4fe",
                        "tpbank-orange": "#F37021",
                        "tpbank-purple": "#502070"
                    },
                    "fontFamily": {
                        "headline-md": ["Manrope"],
                        "headline-lg": ["Manrope"],
                        "body-md": ["Manrope"],
                        "headline-sm": ["Manrope"],
                        "body-lg": ["Manrope"],
                        "label-sm": ["Manrope"],
                        "label-md": ["Manrope"]
                    },
                    "fontSize": {
                        "headline-md": ["22px", {"lineHeight": "28px", "fontWeight": "600"}],
                        "headline-lg": ["28px", {"lineHeight": "36px", "fontWeight": "700"}],
                        "body-md": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                        "headline-sm": ["18px", {"lineHeight": "24px", "fontWeight": "600"}],
                        "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                        "label-sm": ["11px", {"lineHeight": "14px", "fontWeight": "500"}],
                        "label-md": ["12px", {"lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "600"}]
                    }
                }
            }
        }
    </script>
<style>
        body { font-family: 'Manrope', sans-serif; -webkit-tap-highlight-color: transparent; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-surface min-h-screen flex flex-col">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 shadow-sm flex justify-between items-center px-4 h-16">
<button class="text-tpbank-purple font-body-lg font-semibold px-2 py-1 hover:bg-slate-50 rounded-lg transition-colors">
            Hủy
        </button>
<h1 class="font-manrope font-bold text-lg text-tpbank-purple">Tạo công việc mới</h1>
<div class="w-12"></div> <!-- Spacer for symmetry -->
</header>
<main class="flex-grow pt-20 pb-32 px-4 space-y-6">
<!-- AI Assistant Suggestion -->
<div class="bg-purple-50 dark:bg-purple-900/20 border border-purple-100 dark:border-purple-800 rounded-2xl p-4 flex gap-3 items-start">
<div class="bg-white p-2 rounded-xl shadow-sm">
<span class="material-symbols-outlined text-tpbank-purple" style="font-variation-settings: 'FILL' 1;">auto_awesome</span>
</div>
<div class="space-y-1">
<p class="font-label-md text-tpbank-purple uppercase tracking-wider">Gợi ý AI Assistant</p>
<p class="font-body-md text-on-surface-variant">Dựa trên lịch trình của bạn, <span class="font-bold text-tpbank-purple">15:00 chiều nay</span> là thời gian trống tốt nhất để thêm công việc này.</p>
</div>
</div>
<section class="space-y-5">
<!-- Tên công việc -->
<div class="space-y-2">
<label class="font-label-md text-on-surface-variant px-1" for="task-name">Tên công việc</label>
<div class="relative group">
<input class="w-full h-14 bg-white border border-outline-variant rounded-xl px-4 focus:ring-2 focus:ring-tpbank-purple focus:border-tpbank-purple outline-none transition-all font-body-lg shadow-sm" id="task-name" placeholder="Nhập tiêu đề công việc..." type="text"/>
</div>
</div>
<!-- Chọn khách hàng (Search Bar) -->
<div class="space-y-2">
<label class="font-label-md text-on-surface-variant px-1">Chọn khách hàng</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline">person_search</span>
<input class="w-full h-14 bg-white border border-outline-variant rounded-xl pl-12 pr-4 focus:ring-2 focus:ring-tpbank-purple focus:border-tpbank-purple outline-none transition-all font-body-lg shadow-sm" placeholder="Tìm kiếm trong danh sách CRM..." type="text"/>
</div>
</div>
<!-- Grid for Type & Time -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-4">
<!-- Loại công việc -->
<div class="space-y-2">
<label class="font-label-md text-on-surface-variant px-1">Loại công việc</label>
<div class="relative">
<select class="w-full h-14 bg-white border border-outline-variant rounded-xl px-4 appearance-none focus:ring-2 focus:ring-tpbank-purple focus:border-tpbank-purple outline-none transition-all font-body-lg shadow-sm">
<option value="call">Gọi điện</option>
<option value="visit">Thăm viếng</option>
<option value="email">Email</option>
<option value="followup">Follow-up</option>
</select>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 pointer-events-none text-outline">expand_more</span>
</div>
</div>
<!-- Thời gian -->
<div class="space-y-2">
<label class="font-label-md text-on-surface-variant px-1">Thời gian</label>
<div class="relative">
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-outline">event</span>
<input class="w-full h-14 bg-white border border-outline-variant rounded-xl px-4 focus:ring-2 focus:ring-tpbank-purple focus:border-tpbank-purple outline-none transition-all font-body-lg shadow-sm" type="datetime-local"/>
</div>
</div>
</div>
<!-- Mức độ ưu tiên (Segmented Control) -->
<div class="space-y-2">
<label class="font-label-md text-on-surface-variant px-1">Mức độ ưu tiên</label>
<div class="flex p-1 bg-surface-container-high rounded-2xl h-14">
<button class="flex-1 rounded-xl flex items-center justify-center font-label-md transition-all bg-white text-on-surface shadow-sm">Thấp</button>
<button class="flex-1 rounded-xl flex items-center justify-center font-label-md transition-all text-on-surface-variant hover:bg-white/50">Trung bình</button>
<button class="flex-1 rounded-xl flex items-center justify-center font-label-md transition-all text-on-surface-variant hover:bg-white/50">Cao</button>
</div>
</div>
<!-- Ghi chú -->
<div class="space-y-2">
<label class="font-label-md text-on-surface-variant px-1" for="notes">Ghi chú</label>
<textarea class="w-full bg-white border border-outline-variant rounded-xl p-4 focus:ring-2 focus:ring-tpbank-purple focus:border-tpbank-purple outline-none transition-all font-body-lg shadow-sm resize-none" id="notes" placeholder="Thêm mô tả chi tiết hoặc nhắc nhở..." rows="4"></textarea>
</div>
<!-- Options -->
<div class="bg-white border border-outline-variant rounded-2xl p-4 shadow-sm">
<div class="flex items-center justify-between">
<div class="flex items-center gap-3">
<div class="bg-surface-container-low p-2 rounded-xl">
<span class="material-symbols-outlined text-tpbank-purple">sync</span>
</div>
<div>
<p class="font-body-lg font-semibold">Đồng bộ với Outlook</p>
<p class="font-label-sm text-on-surface-variant">Tự động thêm vào Outlook Calendar</p>
</div>
</div>
<label class="relative inline-flex items-center cursor-pointer">
<input checked="" class="sr-only peer" type="checkbox" value=""/>
<div class="w-12 h-6 bg-slate-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full rtl:peer-checked:after:-translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:start-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-tpbank-purple"></div>
</label>
</div>
</div>
</section>
</main>
<!-- Fixed Action Footer -->
<footer class="fixed bottom-0 left-0 w-full bg-white/80 backdrop-blur-md border-t border-slate-100 p-4 pb-safe z-50">
<button class="w-full h-14 bg-tpbank-orange text-white font-manrope font-bold text-lg rounded-2xl shadow-lg shadow-orange-500/20 active:scale-95 transition-transform flex items-center justify-center gap-2">
<span class="material-symbols-outlined">add_task</span>
            Tạo công việc
        </button>
</footer>
<!-- Bottom Navigation (Shared Component Placeholder as per JSON logic) -->
<!-- Note: Hidden here as it's a sub-page/task-focused screen as per UX guidelines -->
<div class="hidden">
<!-- Visual guide for background decoration or brand touch -->
<div class="fixed top-0 right-0 -z-10 w-64 h-64 bg-purple-100/30 rounded-full blur-3xl -mr-32 -mt-32"></div>
<div class="fixed bottom-0 left-0 -z-10 w-64 h-64 bg-orange-100/20 rounded-full blur-3xl -ml-32 -mb-32"></div>
</div>
</body></html>
