<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>TPBank CRM - Tai lieu Phan tich Thiet ke</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Manrope', sans-serif; background: #f8f9ff; color: #0b1c30; line-height: 1.7; }
.header { background: white; border-bottom: 1px solid #e2e8f0; padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
.header-left { display: flex; align-items: center; gap: 12px; }
.header-left img { width: 36px; height: 36px; border-radius: 8px; object-fit: contain; }
.header-left h1 { font-size: 18px; font-weight: 700; color: #390259; }
.header-left p { font-size: 11px; color: #4c444f; }
.btn-demo { padding: 8px 16px; background: #390259; color: white; font-size: 13px; font-weight: 700; border-radius: 999px; text-decoration: none; transition: background 0.2s; }
.btn-demo:hover { background: #502070; }
.container { max-width: 960px; margin: 0 auto; padding: 40px 24px 80px; }
h2 { font-size: 22px; font-weight: 800; color: #390259; margin: 32px 0 12px; border-bottom: 2px solid #390259; padding-bottom: 8px; }
h3 { font-size: 17px; font-weight: 700; color: #390259; margin: 24px 0 8px; }
h4 { font-size: 14px; font-weight: 700; color: #502070; margin: 16px 0 6px; }
p { font-size: 13px; margin-bottom: 8px; }
ul, ol { padding-left: 20px; margin-bottom: 12px; }
li { font-size: 13px; margin-bottom: 4px; }
table { width: 100%; border-collapse: collapse; margin: 12px 0 20px; font-size: 12px; }
th, td { border: 1px solid #cfc3d1; padding: 8px 10px; text-align: left; vertical-align: top; }
th { background: #f4daff; color: #390259; font-weight: 700; }
tr:nth-child(even) { background: #faf8ff; }
.toc { background: white; border: 1px solid #cfc3d1; border-radius: 12px; padding: 24px; margin-bottom: 32px; }
.toc h3 { margin-top: 0; }
.toc ul { list-style: none; padding-left: 0; }
.toc li { margin-bottom: 4px; }
.toc li a { color: #390259; text-decoration: none; font-size: 13px; font-weight: 500; }
.toc li a:hover { text-decoration: underline; }
.toc .indent-1 { padding-left: 16px; }
.toc .indent-2 { padding-left: 32px; }
.section-card { background: white; border: 1px solid #cfc3d1; border-radius: 12px; padding: 24px; margin-bottom: 20px; }
.badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 10px; font-weight: 700; text-transform: uppercase; }
.badge-required { background: #fde8e8; color: #dc2626; }
.badge-optional { background: #e0f2fe; color: #0284c7; }
</style>
</head>
<body>
<div class="header">
  <div class="header-left">
    <img src="UI Demo/logo TPB.png" alt="TPBank Logo"/>
    <div>
      <h1>TPBank CRM</h1>
      <p>Tai lieu Phan tich Thiet ke</p>
    </div>
  </div>
  <a href="dashboard.html" class="btn-demo">Xem Demo</a>
</div>
<div class="container">
</div>
</body>
</html>
